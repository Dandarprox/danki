name = "danki"
main = "worker/api.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "danki"
# Filled in by `wrangler d1 create danki` — see README "Cloudflare hosting".
database_id = "ebf61c52-7968-42c3-b188-c96759e03120"
migrations_dir = "migrations"

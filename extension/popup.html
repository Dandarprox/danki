<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 16px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #FAF7F2; color: #1c1917;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #f5f5f4; }
  }
  h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; }
  h1 .logo { width: 24px; height: 24px; border-radius: 8px; background: #1c1917; color: #FAF7F2;
    display: inline-grid; place-items: center; font-size: 14px; }
  @media (prefers-color-scheme: dark) {
    h1 .logo { background: #FAF7F2; color: #1c1917; }
  }
  label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .1em; opacity: .5; margin: 12px 0 4px; }
  textarea {
    width: 100%; padding: 9px 11px; font-size: 15px; color: inherit;
    border: 1.5px solid #e7e5e4; border-radius: 12px; background: #fff; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  @media (prefers-color-scheme: dark) {
    textarea { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
  }
  textarea { resize: vertical; min-height: 44px; }
  textarea:focus { border-color: #1c1917; box-shadow: 0 0 0 3px rgba(28,25,23,.08); }
  @media (prefers-color-scheme: dark) {
    textarea:focus { border-color: #FAF7F2; box-shadow: 0 0 0 3px rgba(250,247,242,.12); }
  }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 11px; border: 0; border-radius: 13px; font-size: 14px;
    font-weight: 700; cursor: pointer; background: #1c1917; color: #FAF7F2; }
  button:hover { opacity: .9; }
  @media (prefers-color-scheme: dark) {
    button { background: #FAF7F2; color: #1c1917; }
  }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; border: 1.5px solid #e7e5e4; color: inherit; flex: 0 0 auto; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; margin-top: 10px; }
  .check input { width: 16px; height: 16px; accent-color: #1c1917; }
  #status { margin-top: 10px; font-size: 13px; font-weight: 600; min-height: 18px; }
  #status.ok { color: #059669; } #status.err { color: #dc2626; }
  #notoken { background: #fef3c7; color: #92400e; border-radius: 11px; padding: 8px 10px;
    font-size: 13px; margin-bottom: 8px; }
  #notoken a { color: inherit; font-weight: 700; }
  .hint { font-size: 12px; opacity: .55; margin-top: 8px; }
  .hint a { color: inherit; }
  /* searchable list picker */
  #deck { flex: 1; min-width: 0; }
  .lp { position: relative; flex: 1; }
  .lp-display {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 11px;
    font-size: 14px; color: inherit; background: #fff; border: 1.5px solid #e7e5e4;
    border-radius: 12px; cursor: pointer; text-align: left; font-weight: 400;
  }
  @media (prefers-color-scheme: dark) {
    .lp-display { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
  }
  .lp-display:hover { opacity: 1; }
  .lp-display .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .lp-display .n { font-size: 11px; font-weight: 700; opacity: .55; flex-shrink: 0; }
  .lp-display .c { opacity: .45; flex-shrink: 0; font-size: 12px; }
  .lp-drop {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 2;
    background: #fff; color: #1c1917; border: 1px solid rgba(28,25,23,.12); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.25); overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .lp-drop { background: #292524; color: #f5f5f4; border-color: rgba(255,255,255,.14); }
  }
  .lp-drop input {
    width: 100%; border: 0; border-bottom: 1px solid rgba(28,25,23,.1); padding: 9px 11px;
    font-size: 14px; outline: none; background: transparent; color: inherit;
  }
  .lp-list { max-height: 190px; overflow-y: auto; padding: 4px; }
  .lp-group { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em;
    opacity: .45; padding: 7px 9px 2px; }
  .lp-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px;
    border: 0; border-radius: 8px; background: transparent; color: inherit; font-size: 13px;
    cursor: pointer; text-align: left; }
  .lp-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lp-item .n { font-size: 11px; opacity: .55; flex-shrink: 0; }
  .lp-item.sel, .lp-item:hover { background: rgba(28,25,23,.07); }
  @media (prefers-color-scheme: dark) {
    .lp-item.sel, .lp-item:hover { background: rgba(255,255,255,.1); }
  }
  .lp-empty { padding: 10px; font-size: 13px; opacity: .55; text-align: center; }
</style>
</head>
<body>
  <h1><span class="logo">団</span> Add to Danki</h1>
  <div id="notoken" hidden>Set your API token first — <a href="options.html" target="_blank">open settings</a>.</div>
  <label for="front">Front</label>
  <textarea id="front" rows="2" placeholder="Selected word…"></textarea>
  <label for="back">Back <span id="auto" style="font-weight:400;text-transform:none"></span></label>
  <textarea id="back" rows="2" placeholder="Translation…"></textarea>
  <label for="deck">List</label>
  <div class="row" style="margin-top:0">
    <div id="deck"></div>
    <button id="reload" class="ghost" title="Reload lists">↻</button>
  </div>
  <label class="check"><input type="checkbox" id="reversed" /> Study both directions ⇄</label>
  <div class="row">
    <button id="save">Save card ⏎</button>
  </div>
  <div id="status"></div>
  <div class="hint"><a href="#" id="open">Open Danki ↗</a></div>
  <script src="popup.js"></script>
</body>
</html>
